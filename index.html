<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffd6e7">

<title>For My Love 💐</title>

<style>
/* =========================================================
   RESET
========================================================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.9), transparent 20%),
        radial-gradient(circle at 80% 30%, rgba(255,214,231,.8), transparent 25%),
        linear-gradient(135deg, #fff6fa, #ffe4ef, #fff8fb);
    color: #6b304c;
}

/* =========================================================
   MAIN
========================================================= */
.page {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 15px;
    isolation: isolate;
}

/* blurred background circles */
.page::before,
.page::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(10px);
    z-index: -2;
    animation: floatingGlow 7s ease-in-out infinite alternate;
}

.page::before {
    width: 260px;
    height: 260px;
    background: rgba(255, 182, 211, .35);
    top: 5%;
    left: -80px;
}

.page::after {
    width: 300px;
    height: 300px;
    background: rgba(255, 219, 231, .45);
    bottom: -80px;
    right: -80px;
    animation-delay: 2s;
}

@keyframes floatingGlow {
    from {
        transform: translateY(0) scale(1);
    }
    to {
        transform: translateY(-20px) scale(1.05);
    }
}

/* =========================================================
   CARD
========================================================= */
.love-card {
    width: min(920px, 100%);
    min-height: 650px;
    padding: 45px 25px 40px;
    position: relative;

    background: rgba(255, 255, 255, .52);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border: 1px solid rgba(255, 255, 255, .75);
    border-radius: 35px;

    box-shadow:
        0 30px 80px rgba(125, 55, 86, .13),
        inset 0 1px 0 rgba(255,255,255,.8);

    text-align: center;
    overflow: hidden;
}

/* =========================================================
   DECORATIVE LIGHT
========================================================= */
.light {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: white;
    box-shadow:
        0 0 15px rgba(255,255,255,.9),
        0 0 30px rgba(255,164,198,.5);

    animation: twinkle 2.5s ease-in-out infinite alternate;
}

.light:nth-child(1) {
    top: 15%;
    left: 15%;
}

.light:nth-child(2) {
    top: 22%;
    right: 13%;
    animation-delay: .4s;
}

.light:nth-child(3) {
    top: 58%;
    left: 8%;
    animation-delay: .8s;
}

.light:nth-child(4) {
    top: 68%;
    right: 9%;
    animation-delay: 1.2s;
}

.light:nth-child(5) {
    top: 35%;
    left: 50%;
    animation-delay: 1.5s;
}

@keyframes twinkle {
    0% {
        opacity: .25;
        transform: scale(.7);
    }
    100% {
        opacity: 1;
        transform: scale(1.35);
    }
}

/* =========================================================
   TEXT
========================================================= */
.small-title {
    font-size: 14px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #b46b88;
    margin-bottom: 12px;
    animation: fadeDown 1s ease forwards;
}

.main-title {
    font-family: Georgia, serif;
    font-size: clamp(38px, 7vw, 72px);
    line-height: 1.05;
    color: #7c3654;
    text-shadow:
        0 5px 20px rgba(126, 44, 80, .12);
    margin-bottom: 16px;
    animation: fadeDown 1.2s ease forwards;
}

.main-title span {
    display: inline-block;
    color: #d45e89;
    animation: heartBeat 2s infinite;
}

.subtitle {
    max-width: 620px;
    margin: 0 auto 20px;
    line-height: 1.7;
    font-size: 16px;
    color: #8e536b;
    animation: fadeUp 1.4s ease forwards;
}

@keyframes fadeDown {
    from {
        opacity: 0;
        transform: translateY(-25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes heartBeat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }
}

/* =========================================================
   BOUQUET AREA
========================================================= */
.bouquet-area {
    position: relative;
    width: 100%;
    height: 370px;
    margin: 5px auto 10px;
}

/* =========================================================
   BOUQUET WRAP
========================================================= */
.wrapper {
    position: absolute;
    bottom: 22px;
    left: 50%;
    width: 180px;
    height: 130px;
    transform: translateX(-50%);
    z-index: 4;
}

/* paper */
.wrapper::before {
    content: "";
    position: absolute;
    left: 15px;
    top: 12px;
    width: 150px;
    height: 105px;

    background:
        linear-gradient(135deg, #fffafc, #f8d7e4);

    clip-path: polygon(
        8% 0%,
        92% 0%,
        100% 100%,
        50% 82%,
        0% 100%
    );

    transform: rotate(-2deg);
    box-shadow: 0 10px 20px rgba(120, 52, 79, .12);
}

.wrapper::after {
    content: "";
    position: absolute;
    left: 63px;
    bottom: 0;
    width: 55px;
    height: 27px;

    background: #d96d92;

    clip-path: polygon(
        0 0,
        100% 0,
        86% 100%,
        50% 72%,
        14% 100%
    );
}

/* ribbon */
.ribbon {
    position: absolute;
    left: 72px;
    bottom: 10px;
    width: 36px;
    height: 28px;
    background: #ef8fb0;
    z-index: 3;
    border-radius: 50%;
}

.ribbon::before,
.ribbon::after {
    content: "";
    position: absolute;
    width: 40px;
    height: 25px;
    background: #ef8fb0;
    top: 4px;
}

.ribbon::before {
    right: 18px;
    transform: rotate(25deg);
    border-radius: 50% 10px 50% 50%;
}

.ribbon::after {
    left: 18px;
    transform: rotate(-25deg);
    border-radius: 10px 50% 50% 50%;
}

/* =========================================================
   STEMS
========================================================= */
.stem {
    position: absolute;
    bottom: 78px;
    left: 50%;
    width: 5px;
    background: linear-gradient(to right, #39785d, #67a67f);
    border-radius: 50px;
    transform-origin: bottom center;
    z-index: 2;
}

.stem::after {
    content: "";
    position: absolute;
    bottom: 40%;
    width: 30px;
    height: 15px;
    background: #5b9a72;
    border-radius: 100% 0;
}

/* individual stems */
.s1 {
    height: 200px;
    transform: translateX(-50%) rotate(-24deg);
}

.s2 {
    height: 220px;
    transform: translateX(-50%) rotate(-12deg);
}

.s3 {
    height: 230px;
    transform: translateX(-50%) rotate(0deg);
}

.s4 {
    height: 220px;
    transform: translateX(-50%) rotate(12deg);
}

.s5 {
    height: 195px;
    transform: translateX(-50%) rotate(24deg);
}

/* =========================================================
   FLOWERS
========================================================= */
.flower {
    position: absolute;
    width: 95px;
    height: 95px;
    z-index: 3;

    animation:
        flowerFloat 4s ease-in-out infinite;
}

.flower-1 {
    left: calc(50% - 165px);
    top: 72px;
    animation-delay: .2s;
}

.flower-2 {
    left: calc(50% - 85px);
    top: 20px;
    animation-delay: .7s;
}

.flower-3 {
    left: calc(50% - 47px);
    top: -2px;
    z-index: 5;
    animation-delay: 1.1s;
}

.flower-4 {
    left: calc(50% + 8px);
    top: 22px;
    animation-delay: .5s;
}

.flower-5 {
    left: calc(50% + 75px);
    top: 78px;
    animation-delay: .9s;
}

@keyframes flowerFloat {
    0%, 100% {
        transform: translateY(0) rotate(-2deg);
    }

    50% {
        transform: translateY(-10px) rotate(2deg);
    }
}

/* petals */
.petal {
    position: absolute;
    width: 39px;
    height: 55px;
    left: 28px;
    top: 15px;

    border-radius: 50% 50% 45% 45%;

    background:
        radial-gradient(circle at 45% 30%, #fff 0 6%, transparent 7%),
        linear-gradient(135deg, #fff0f6, #f58eb3);

    transform-origin: center bottom;
    box-shadow:
        inset 0 -8px 12px rgba(190, 69, 113, .16),
        0 5px 10px rgba(134, 44, 82, .08);
}

.petal:nth-child(1) {
    transform: rotate(0deg) translateY(-20px);
}

.petal:nth-child(2) {
    transform: rotate(45deg) translateY(-20px);
}

.petal:nth-child(3) {
    transform: rotate(90deg) translateY(-20px);
}

.petal:nth-child(4) {
    transform: rotate(135deg) translateY(-20px);
}

.petal:nth-child(5) {
    transform: rotate(180deg) translateY(-20px);
}

.petal:nth-child(6) {
    transform: rotate(225deg) translateY(-20px);
}

.petal:nth-child(7) {
    transform: rotate(270deg) translateY(-20px);
}

.petal:nth-child(8) {
    transform: rotate(315deg) translateY(-20px);
}

/* yellow center */
.center {
    position: absolute;
    width: 34px;
    height: 34px;
    left: 31px;
    top: 31px;

    border-radius: 50%;

    background:
        radial-gradient(circle at 30% 30%, #fff8be, #ffd95a);

    box-shadow:
        0 0 0 7px rgba(255, 224, 120, .12),
        0 4px 8px rgba(135, 91, 17, .13);

    z-index: 10;
}

/* flower variants */
.flower-2 .petal,
.flower-4 .petal {
    background:
        radial-gradient(circle at 45% 30%, #fff 0 5%, transparent 6%),
        linear-gradient(135deg, #fff6f8, #f8b5c9);
}

.flower-3 .petal {
    background:
        radial-gradient(circle at 45% 30%, #fff 0 5%, transparent 6%),
        linear-gradient(135deg, #fff4f8, #e96d9a);
}

.flower-5 .petal {
    background:
        radial-gradient(circle at 45% 30%, #fff 0 5%, transparent 6%),
        linear-gradient(135deg, #fff1f2, #f0a1b8);
}

/* =========================================================
   LEAVES
========================================================= */
.leaf {
    position: absolute;
    width: 50px;
    height: 25px;
    background: linear-gradient(135deg, #b8e1bf, #5b9c71);
    border-radius: 100% 0 100% 0;
    z-index: 2;
}

.leaf1 {
    bottom: 125px;
    left: calc(50% - 100px);
    transform: rotate(-35deg);
}

.leaf2 {
    bottom: 155px;
    left: calc(50% + 35px);
    transform: rotate(50deg);
}

.leaf3 {
    bottom: 100px;
    left: calc(50% - 35px);
    transform: rotate(15deg);
}

/* =========================================================
   LOVE MESSAGE
========================================================= */
.message-box {
    position: relative;
    max-width: 700px;
    margin: 10px auto 0;
    padding: 22px 20px;

    border-radius: 22px;
    background: rgba(255, 255, 255, .53);
    border: 1px solid rgba(255,255,255,.72);

    box-shadow:
        0 15px 35px rgba(126,52,83,.08),
        inset 0 1px rgba(255,255,255,.9);

    animation: fadeUp 1.8s ease forwards;
}

.message-box::before,
.message-box::after {
    content: "♥";
    position: absolute;
    font-size: 18px;
    color: #ed92b0;
    animation: heartBeat 1.7s infinite;
}

.message-box::before {
    left: 18px;
    top: 12px;
}

.message-box::after {
    right: 18px;
    bottom: 12px;
    animation-delay: .6s;
}

.love-text {
    font-family: Georgia, serif;
    font-size: clamp(19px, 3.5vw, 28px);
    line-height: 1.6;
    color: #8b3f5d;
    font-style: italic;
    padding: 8px 25px;
}

.forever {
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: 4px;
    color: #b3728b;
}

/* =========================================================
   BUTTON
========================================================= */
.love-button {
    margin-top: 22px;
    border: 0;
    padding: 14px 28px;

    border-radius: 999px;

    background: linear-gradient(135deg, #e97ca2, #d85b88);
    color: white;

    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    box-shadow:
        0 12px 25px rgba(211, 86, 132, .25);

    transition: .3s ease;
}

.love-button:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow:
        0 16px 35px rgba(211, 86, 132, .35);
}

.love-button:active {
    transform: scale(.96);
}

/* =========================================================
   FLOATING HEARTS
========================================================= */
.heart {
    position: fixed;
    bottom: -50px;

    color: rgba(225, 91, 137, .45);

    font-size: 20px;

    pointer-events: none;
    z-index: 30;

    animation:
        floatHeart linear forwards;
}

@keyframes floatHeart {
    0% {
        transform:
            translateY(0)
            scale(.7)
            rotate(0);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(-110vh)
            translateX(var(--move))
            scale(1.3)
            rotate(30deg);
        opacity: 0;
    }
}

/* =========================================================
   FLOWER PETALS FALLING
========================================================= */
.falling-petal {
    position: fixed;
    top: -30px;
    width: 13px;
    height: 20px;

    background: linear-gradient(135deg, #fff3f8, #ee9bb9);

    border-radius: 100% 0 100% 0;

    opacity: .65;

    pointer-events: none;
    z-index: 1;

    animation: fall linear forwards;
}

@keyframes fall {
    from {
        transform:
            translateY(-20px)
            rotate(0deg);
    }

    to {
        transform:
            translateY(110vh)
            translateX(var(--x))
            rotate(360deg);
    }
}

/* =========================================================
   RESPONSIVE
========================================================= */
@media (max-width: 700px) {

    .love-card {
        min-height: 680px;
        padding: 35px 15px 30px;
        border-radius: 28px;
    }

    .bouquet-area {
        height: 340px;
        transform: scale(.87);
        margin: -5px auto -10px;
    }

    .message-box {
        margin-top: 0;
    }

    .small-title {
        font-size: 11px;
        letter-spacing: 4px;
    }

    .subtitle {
        font-size: 14px;
        padding: 0 15px;
    }

    .love-text {
        font-size: 19px;
        padding: 8px 15px;
    }
}

@media (max-width: 430px) {

    .love-card {
        min-height: 660px;
    }

    .bouquet-area {
        transform: scale(.75);
        margin-top: -20px;
        margin-bottom: -35px;
    }

    .main-title {
        font-size: 42px;
    }

    .message-box {
        padding: 18px 12px;
    }

    .love-text {
        font-size: 17px;
    }
}
</style>
</head>


<body>

<!-- =====================================================
     MAIN PAGE
====================================================== -->

<div class="page">

    <div class="love-card">

        <!-- Decorative lights -->
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>


        <!-- Header -->
        <div class="small-title">
            A Little Flower For You
        </div>

        <h1 class="main-title">
            For My <span>♥</span> Love
        </h1>

        <p class="subtitle">
            A beautiful little bouquet for the most special person
            in my world.
        </p>


        <!-- =================================================
             BOUQUET
        ================================================== -->

        <div class="bouquet-area">

            <!-- Leaves -->
            <div class="leaf leaf1"></div>
            <div class="leaf leaf2"></div>
            <div class="leaf leaf3"></div>

            <!-- Stems -->
            <div class="stem s1"></div>
            <div class="stem s2"></div>
            <div class="stem s3"></div>
            <div class="stem s4"></div>
            <div class="stem s5"></div>


            <!-- Flower 1 -->
            <div class="flower flower-1">

                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>

                <div class="center"></div>

            </div>


            <!-- Flower 2 -->
            <div class="flower flower-2">

                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>

                <div class="center"></div>

            </div>


            <!-- Main Flower -->
            <div class="flower flower-3">

                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>

                <div class="center"></div>

            </div>


            <!-- Flower 4 -->
            <div class="flower flower-4">

                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>

                <div class="center"></div>

            </div>


            <!-- Flower 5 -->
            <div class="flower flower-5">

                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>

                <div class="center"></div>

            </div>


            <!-- Wrapping -->
            <div class="wrapper">
                <div class="ribbon"></div>
            </div>

        </div>


        <!-- =================================================
             LOVE MESSAGE
        ================================================== -->

        <div class="message-box">

            <div class="love-text">
                “You are the most precious gift I could ever receive.”
            </div>

            <div class="forever">
                WITH ALL MY HEART ♥
            </div>

        </div>


        <!-- Button -->
        <button class="love-button" onclick="showLove()">
            Open My Heart ❤️
        </button>

    </div>

</div>


<script>

/* =========================================================
   HEART EFFECT
========================================================= */

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.innerHTML = Math.random() > 0.5 ? "♥" : "♡";

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.fontSize =
        (14 + Math.random() * 22) + "px";

    heart.style.animationDuration =
        (5 + Math.random() * 5) + "s";

    heart.style.setProperty(
        "--move",
        (-80 + Math.random() * 160) + "px"
    );

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 10000);
}


/* create heart every 500ms */

setInterval(createHeart, 500);


/* =========================================================
   FLOWER PETAL EFFECT
========================================================= */

function createPetal() {

    const petal = document.createElement("div");

    petal.className = "falling-petal";

    petal.style.left =
        Math.random() * 100 + "vw";

    petal.style.animationDuration =
        (6 + Math.random() * 6) + "s";

    petal.style.setProperty(
        "--x",
        (-100 + Math.random() * 200) + "px"
    );

    petal.style.transform =
        `rotate(${Math.random() * 360}deg)`;

    document.body.appendChild(petal);

    setTimeout(() => {
        petal.remove();
    }, 13000);
}


/* create falling petals */

setInterval(createPetal, 900);


/* =========================================================
   LOVE BUTTON
========================================================= */

function showLove() {

    // create a burst of hearts
    for (let i = 0; i < 18; i++) {

        setTimeout(() => {

            const heart = document.createElement("div");

            heart.className = "heart";

            heart.innerHTML = "♥";

            heart.style.left = "50vw";

            heart.style.bottom = "35%";

            heart.style.fontSize =
                (15 + Math.random() * 25) + "px";

            heart.style.animationDuration =
                (2.5 + Math.random() * 2) + "s";

            heart.style.setProperty(
                "--move",
                (-250 + Math.random() * 500) + "px"
            );

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);

        }, i * 80);
    }

    // button message
    const button = document.querySelector(".love-button");

    button.innerHTML =
        "You will always have my heart ❤️";

    button.style.transform =
        "scale(1.05)";

    setTimeout(() => {
        button.style.transform =
            "scale(1)";
    }, 300);
}


/* =========================================================
   EXTRA HEARTS ON PAGE LOAD
========================================================= */

window.addEventListener("load", () => {

    for (let i = 0; i < 12; i++) {

        setTimeout(() => {
            createHeart();
        }, i * 250);

    }

});

</script>

</body>
</html>
